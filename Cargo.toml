[package]
name = "clipbord"
version = "0.1.0"
edition = "2021"
description = "Fast clipboard history for Fedora / GNOME — Win+V style"
license = "MIT"
authors = ["Clipbord Contributors"]
repository = "https://github.com/example/clipbord"
keywords = ["clipboard", "history", "gnome", "wayland", "fedora"]
categories = ["gui"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
gdk4 = { version = "0.9", package = "gdk4" }
gdk4-x11 = { version = "0.9", features = ["xlib"] }
gio = "0.20"
glib = "0.20"
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x11 = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
